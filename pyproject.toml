[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "roadpulse-ai"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "opencv-python", "onnxruntime", "onnx", "trackers", "supervision", "fastapi", "uvicorn", "python-multipart", "psutil", "imageio-ffmpeg"]
[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
